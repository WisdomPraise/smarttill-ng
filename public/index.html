<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8" />

  <style>
    :root {
      --forest: #12452d;
      --forest-dark: #0c3120;
      --forest-light: #e8f3ee;
      --bg: #f6f8f7;
      --border: #e2e8e4;
      --text: #111827;
      --muted: #6b7280;
      --accent: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    /* LOGIN SCREEN */
    .login-wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; background: #f8faf8; }
    .login-box { width: 100%; max-width: 390px; text-align: center; }
    .brand-logo { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .logo-icon { width: 36px; height: 36px; background: var(--forest); color: #fff; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; }
    .login-sub { font-size: 14px; color: var(--muted); margin-bottom: 26px; }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
    .form-input:focus { border-color: var(--forest); }
    .btn-signin { width: 100%; padding: 13px; background: var(--forest); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .btn-signin:hover { background: var(--forest-dark); }
    .login-hint { font-size: 12px; color: var(--muted); margin-top: 16px; }

    /* APP SHELL */
    .app-shell { display: none; min-height: 100vh; }
    .sidebar { width: 240px; background: #ffffff; border-right: 1px solid var(--border); padding: 22px 14px; display: flex; flex-direction: column; justify-content: space-between; position: fixed; top: 0; bottom: 0; left: 0; }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; padding: 0 10px 24px; }
    .nav-list { display: flex; flex-direction: column; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #4b5563; cursor: pointer; border: none; background: transparent; text-align: left; width: 100%; }
    .nav-item:hover { background: #f3f4f6; color: var(--text); }
    .nav-item.active { background: var(--forest); color: #ffffff; }
    .sidebar-footer { padding: 12px; background: var(--forest-light); border-radius: 12px; font-size: 12px; color: var(--forest-dark); line-height: 1.4; }
    .sidebar-footer strong { display: block; margin-bottom: 4px; }

    .main-area { margin-left: 240px; flex: 1; display: flex; flex-direction: column; }
    .topbar { height: 64px; background: #ffffff; border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; }
    .store-name { font-size: 14px; font-weight: 600; color: #374151; }
    .top-badges { display: flex; align-items: center; gap: 10px; }
    .pill-testnet { background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; border: 1px solid #bbf7d0; }
    .pill-wm { background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; border: 1px solid #fde68a; }
    .avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--forest); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }

    .page-content { padding: 32px; max-width: 960px; width: 100%; }
    .page-title { font-size: 26px; font-weight: 800; color: var(--text); }
    .page-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

    /* STATUS PILLS */
    .status-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 22px; align-items: center; }
    .status-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #fff; border: 1px solid var(--border); color: #374151; }
    .dot-green { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
    .auth-link { font-size: 12px; font-weight: 700; color: var(--forest); text-decoration: underline; }

    /* HERO BALANCE CARD */
    .hero-card { background: linear-gradient(135deg, #134e32, #0d3824); color: #ffffff; border-radius: 18px; padding: 28px; box-shadow: 0 12px 24px -8px rgba(18, 69, 45, 0.35); margin-bottom: 20px; }
    .hero-label { font-size: 13px; color: #a7f3d0; font-weight: 600; }
    .hero-amount-row { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 4px; }
    .hero-amount { font-size: 42px; font-weight: 800; letter-spacing: -0.02em; }
    .hero-curr { font-size: 18px; font-weight: 700; color: #a7f3d0; }
    .hero-ngn { font-size: 13px; color: #d1fae5; opacity: 0.9; }
    .hero-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(255,255,255,0.14); margin-top: 22px; padding-top: 16px; }
    .stat-label { font-size: 12px; color: #a7f3d0; }
    .stat-val { font-size: 18px; font-weight: 800; margin-top: 2px; }

    /* SPLIT CARDS */
    .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
    .split-card { background: #ffffff; border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .split-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #4b5563; }
    .split-pct { background: #f3f4f6; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #111827; }
    .split-val { font-size: 26px; font-weight: 800; margin-top: 12px; }
    .split-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* SIMULATE POS & LIVE TRACKER */
    .action-panel { background: #ffffff; border: 1px solid var(--border); border-radius: 18px; padding: 24px; margin-bottom: 22px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .panel-title { font-size: 16px; font-weight: 800; }
    .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .btn-sale { padding: 14px 10px; border-radius: 12px; border: 1.5px solid #cbd5e1; background: #f8fafc; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-sale:hover { border-color: var(--forest); background: var(--forest-light); }
    .btn-sale.featured { background: var(--forest); color: #fff; border-color: var(--forest); }
    .btn-sale.featured:hover { background: var(--forest-dark); }
    .btn-credit { width: 100%; padding: 13px; border-radius: 12px; border: 1.5px dashed var(--forest); background: #f0fdf4; color: var(--forest-dark); font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn-credit:hover { background: #dcfce7; }

    .tracker-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .step-pill { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 8px; background: #f3f4f6; color: #6b7280; }
    .step-pill.done { background: #dcfce7; color: #15803d; }
    .step-pill.active { background: #fef3c7; color: #b45309; }

    .wa-preview { display: none; margin-top: 16px; background: #e7ffdb; border: 1px solid #86efac; border-radius: 14px; padding: 16px; font-size: 13px; line-height: 1.5; }
    .wa-header { font-weight: 800; color: #166534; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .tx-code { font-size: 11px; color: #4b5563; margin-top: 8px; font-family: monospace; word-break: break-all; }

    /* ALLOCATION VIEW */
    .alloc-card { background: #ffffff; border: 1px solid var(--border); border-radius: 18px; padding: 28px; max-width: 580px; margin-top: 20px; }
    .preset-pills { display: flex; gap: 10px; margin-bottom: 20px; }
    .pill-btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    .pill-btn.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .alloc-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .alloc-box-dark { background: var(--forest); color: #fff; padding: 20px; border-radius: 14px; }
    .alloc-box-light { background: #f3f6f4; color: var(--text); padding: 20px; border-radius: 14px; }
    .alloc-box-label { font-size: 12px; opacity: 0.85; font-weight: 600; }
    .alloc-box-num { font-size: 32px; font-weight: 800; margin-top: 6px; }
    .slider { width: 100%; accent-color: var(--forest); margin: 10px 0 14px; cursor: pointer; }

    /* TABLE & WALLETS */
    .table-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 14px 18px; background: #f9fafb; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); }
    td { padding: 14px 18px; border-bottom: 1px solid #f3f4f6; }
    .wallet-list { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
.wallet-row { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; }
.mono { font-family: monospace; font-size: 12px; color: var(--forest); background: var(--forest-light); padding: 4px 8px; border-radius: 6px; margin-top: 4px; display: inline-block; }
.view-section { display: none; }
.view-section.active { display: block; }
@media (max-width: 768px) {
.sidebar { display: none; }
.main-area { margin-left: 0; }
.split-grid, .preset-grid { grid-template-columns: 1fr 1fr; }
}

let reservePct = 70;
let totalEur = 0;
let reserveEur = 0;
let ownerEur = 0;
let salesCount = 0;
const txHistory = [];
if (document.referrer.includes("/api/callback") || window.location.hash === "#dashboard") {
enterApp();
}
function enterApp() {
document.getElementById("login-view").style.display = "none";
document.getElementById("app-shell").style.display = "flex";
}
function switchTab(tabName, btnEl) {
document.querySelectorAll(".view-section").forEach(el => el.classList.remove("active"));
document.getElementById("tab-" + tabName).classList.add("active");
document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
btnEl.classList.add("active");
}
function setSplit(pct, btnEl) {
reservePct = pct;
document.getElementById("split-slider").value = pct;
document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
btnEl.classList.add("active");
updateAllocUI();
}
function sliderSplit(val) {
reservePct = Number(val);
document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
updateAllocUI();
}
function updateAllocUI() {
const ownerPct = 100 - reservePct;
document.getElementById("alloc-res-num").textContent = reservePct + "%";
document.getElementById("alloc-own-num").textContent = ownerPct + "%";
document.getElementById("alloc-explain").innerHTML =
A 100.00 sale sends <strong>${reservePct}.00</strong> to your Reserve and <strong>${ownerPct}.00</strong> to you.;
document.getElementById("badge-reserve-pct").textContent = reservePct + "%";
document.getElementById("badge-owner-pct").textContent = ownerPct + "%";
}
function saveAlloc() {
document.getElementById("alloc-saved-msg").textContent = "✓ Split rule updated!";
setTimeout(() => document.getElementById("alloc-saved-msg").textContent = "", 2500);
}
window.addEventListener("monetization", () => {
const pill = document.getElementById("wm-pill");
pill.textContent = "🟢 Streaming Micro-Tips";
pill.style.background = "#dcfce7";
pill.style.color = "#15803d";
});
async function runSale(amountCents, sourceLabel) {
const status = document.getElementById("status-text");
const steps = ["step-1", "step-2", "step-3", "step-4"];
steps.forEach(id => document.getElementById(id).className = "step-pill");
document.getElementById("step-1").classList.add("active");
status.style.color = "#b45309";
status.textContent = "⏳ Requesting incoming invoices, quotes & executing Open Payments split...";
setTimeout(() => {
document.getElementById("step-1").className = "step-pill done";
document.getElementById("step-2").classList.add("active");
}, 600);
try {
const res = await fetch("/api/simulate-sale", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ amount: amountCents, source: sourceLabel }),
});
const data = await res.json();
if (!data.success) throw new Error(data.error);
steps.forEach(id => document.getElementById(id).className = "step-pill done");
totalEur += data.split.total;
reserveEur += data.split.restockSaved;
ownerEur += data.split.dailyProfit;
salesCount += 1;
document.getElementById("hero-eur").textContent = totalEur.toFixed(2);
document.getElementById("hero-ngn").textContent =
≈ ₦${(totalEur * 1000).toLocaleString()} (1,000:1 Illustrative Naira Scale);
document.getElementById("stat-count").textContent = salesCount;
document.getElementById("stat-today").textContent = ${totalEur.toFixed(2)} EUR;
document.getElementById("card-reserve-eur").innerHTML =
${reserveEur.toFixed(2)} <span style="font-size:14px;color:var(--muted);">EUR</span>;
document.getElementById("card-reserve-ngn").textContent =
≈ ₦${(reserveEur * 1000).toLocaleString()} locked for inventory;
document.getElementById("card-owner-eur").innerHTML =
${ownerEur.toFixed(2)} <span style="font-size:14px;color:var(--muted);">EUR</span>;
document.getElementById("card-owner-ngn").textContent =
≈ ₦${(ownerEur * 1000).toLocaleString()} available for spending;
const waBox = document.getElementById("wa-preview");
waBox.style.display = "block";
document.getElementById("wa-body").innerHTML =
<strong>[${sourceLabel}]</strong> Hello Mummy Emma! Received <strong>₦${(data.split.total * 1000).toLocaleString()}</strong> (€${data.split.total.toFixed(2)}).<br/> +
🔒 <strong>₦${(data.split.restockSaved * 1000).toLocaleString()}</strong> moved to Business Reserve •  +
💵 <strong>₦${(data.split.dailyProfit * 1000).toLocaleString()}</strong> moved to Owner Allocation.;
document.getElementById("wa-tx").textContent =
ILP Outgoing Tx: ${data.transactions.restockId};
txHistory.unshift({
time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
source: sourceLabel,
total: data.split.total.toFixed(2),
reserve: data.split.restockSaved.toFixed(2),
owner: data.split.dailyProfit.toFixed(2),
});
renderTxTable();
status.style.color = "#15803d";
status.textContent = "✅ Settled live on Interledger Testnet & dispatched WhatsApp alert!";
} catch (err) {
status.style.color = "#dc2626";
status.textContent = "❌ " + err.message + " (Click 'Re-Authorize Till Grant' above if token expired)";
}
}
function renderTxTable() {
const tbody = document.getElementById("tx-table-body");
tbody.innerHTML = txHistory.map(tx => `
${tx.time}
${tx.source}€\({tx.total} (₦\){(tx.total * 1000).toLocaleString()})+€${tx.reserve}+€${tx.owner}Settled`).join("");
}
